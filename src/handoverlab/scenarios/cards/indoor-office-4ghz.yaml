# Scenario card (machine-readable).  docs/scenarios/indoor-office-4ghz.md is generated from this file.
name: indoor-office-4ghz
title: The TR 38.901 indoor office with ceiling sites at 4 GHz
since: 1.7.0
purpose: >
  An indoor counterpart of the outdoor scenarios: the indoor office of TR 38.901 (a hall of
  120 m x 50 m, 12 ceiling sites 20 m apart in two rows, sites 3 m and users 1 m high) with the
  InH-Office path loss and the LOS probability of the mixed office, the link budget of the
  IMT-2020 Indoor Hotspot-eMBB evaluation at 4 GHz, and pedestrians at about 3 km/h.  Cells are
  small and close together, so the neighbours are almost as strong as the serving cell: handovers
  are slow but frequent, and ping-pong and unnecessary handovers matter more than late ones.  Use
  it to see how a rule copes with dense, interference-limited coverage at walking speed.
layout_note: >
  A 120 m x 50 m hall, 12 sites on a 20 m grid (6 x 2), 10 m from the short walls and 15 m from
  the long walls as in TR 38.901 Figure 7.2-1.  No walls are drawn: the InH LOS probability stands
  for the walls and furniture of the office.
