# Scenario card (machine-readable).  docs/scenarios/ns3-urban-3.5ghz.md is generated from this file.
name: ns3-urban-3.5ghz
title: Reference scenario of the comparison with ns-3 / 5G-LENA
since: 0.2.0
purpose: >
  An urban scenario that was also simulated with the packet-level simulator ns-3 and its 5G-LENA
  module: the 2 x 2-block TR 37.885 grid with seven sites (400 m apart here; the 200 m variant is
  part of the comparison), a 3.5 GHz carrier with 10 MHz, omnidirectional antennas, line of sight
  from the buildings only, shadowing drawn along each user's path, 20 vehicles at a constant
  16 m/s on the street centre lines, one L1 sample every 200 ms and light traffic.  The stored
  ns-3 results for 24 Event-A3 settings are the reference of `handoverlab verify --ns3`.
layout_note: >
  Seven sites at (0, 0), (+-400, 0), (+-200, +-250) m in the 2 x 2-block grid.
scenario:
  name: ns3-urban-3.5ghz
  layout:
    kind: street_grid
    blocks: [2, 2]
    sites: [[0.0, 0.0], [400.0, 0.0], [-400.0, 0.0], [200.0, 250.0], [-200.0, 250.0], [200.0, -250.0], [-200.0, -250.0]]
  radio: {carrier_ghz: 3.5, bandwidth_mhz: 10.0, tx_power_dbm: 40.0, bs_gain_db: 0.0, noise_figure_db: 5.0,
          isolation: 1.0, place_share: 0.0, clutter_los: false, time_var_db: 0.0, l1_error_db: 0.0}
  protocol: {l1_period_s: 0.2, report_interval_s: 0.2, label_period_s: 0.2, exec_s: 0.01}
  traffic: {hotspot_share: 0.0, hotspot_load: [0.03, 0.03], normal_load: [0.03, 0.03], rate_scale: 0.001}
  mobility: {users: 20, profile: c16}
  run: {duration_s: 150.0, warmup_s: 60.0}
sources:
  layout.sites: "the ns-3 study (seven sites)"
  radio.carrier_ghz: "the ns-3 study (3.5 GHz, 10 MHz)"
  radio.bandwidth_mhz: "the ns-3 study"
  radio.tx_power_dbm: "the ns-3 study (40 dBm)"
  radio.bs_gain_db: "the ns-3 study (omnidirectional antennas)"
  radio.noise_figure_db: "the ns-3 study (5 dB)"
  radio.isolation: "no beam isolation (omnidirectional antennas)"
  radio.place_share: "ns-3 draws shadowing per link: no place-tied part"
  radio.clutter_los: "the ns-3 study (LOS from the buildings only)"
  radio.time_var_db: "not modelled in the ns-3 study"
  radio.l1_error_db: "not modelled in the ns-3 study"
  protocol.l1_period_s: "the ns-3 study (one sample every 200 ms)"
  protocol.report_interval_s: "matched to the L1 period"
  protocol.exec_s: "the ns-3 study"
  traffic.normal_load: "assumption: light traffic of 10 packets/s per user, about 3 % load"
  traffic.hotspot_load: "assumption (as normal_load)"
  traffic.rate_scale: "light traffic"
  mobility.profile: "the ns-3 study (constant speed on the centre lines; c8, c16 and c30 are compared)"
  run.duration_s: "the ns-3 study (150 s, the first 60 s not counted)"
limitations:
  - "Seeds are different realisations in the two simulators; only averages over settings and conditions can be compared."
  - "The interfering load is defined differently in the two simulators, so failure rates are reported without a pass limit."
  - "Only baseline handover can be compared: 5G-LENA has no conditional handover."
  - "The shadowing along each user's path has one decorrelation distance, the UMi LOS value of 10 m, also on NLOS links (TR 38.901 Table 7.5-6 Part-1: NLOS 13 m)."
references:
  - "ns-3 / 5G-LENA results for 24 Event-A3 settings on four conditions (site distance 200 / 400 m, 16 / 30 m/s), stored in handoverlab/verify/data/ns3_urban_a3.json; acceptance limits: median ratio of handover and of unnecessary-handover rates in [0.8, 1.25], rank correlation over the settings at least 0.9 (`handoverlab verify --ns3`)."
  - "Result of version 0.2.0a1 (one seed per condition): median ratio HandoverLab / ns-3 of 0.95 for the handover rate and 1.04 for the unnecessary-handover rate, rank correlation 0.99 for both; failure rate 0.13 against 0.43 per UE-minute (rank correlation 0.54), mean serving SINR 26.2 dB against 11.5 dB."
