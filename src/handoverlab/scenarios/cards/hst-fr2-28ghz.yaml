# Scenario card (machine-readable).  docs/scenarios/hst-fr2-28ghz.md is generated from this file.
name: hst-fr2-28ghz
title: High-speed train in FR2 (TR 38.854 Scenario-A, unidirectional RRHs, 28 GHz, 350 km/h)
since: 2.3.0
purpose: >
  The FR2 high-speed train deployment of TR 38.854 as its system-level mobility study uses it
  (Table 6.3.8.1-1): one train with one roof-mounted CPE at 350 km/h on a straight track, remote
  radio heads (RRHs) every 700 m on one side of the track, 10 m from it (Scenario-A), each RRH with
  one panel and one SSB beam pointing along the track towards the next RRH, every RRH its own cell
  (L3 handover, no DPS / SFN), TR 38.901 RMa with line of sight only at 28 GHz, and no inter-cell
  interference.  The card's RRHs point west (towards -x); a train going east then travels towards
  the serving beams ("opposite direction" of the TR), a train going west away from them ("same
  direction").  Point the RRHs east with `radio.beams.sector_az0_deg: 359.18` to swap the two.  The
  TR's handover settings are event A3 with 3 dB offset and 80 ms time-to-trigger
  (`{rule: a3, off_db: 3.0, ttt_s: 0.08}`).
layout_note: >
  A track of 8400 m along the x axis with wrap-around, twelve RRH sites 700 m apart on its northern
  side, 10 m from it; the two directions of travel share the track.
