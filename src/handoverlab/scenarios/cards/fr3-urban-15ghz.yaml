# Scenario card (machine-readable).  docs/scenarios/fr3-urban-15ghz.md is generated from this file.
name: fr3-urban-15ghz
title: The TR 37.885 urban grid in the upper mid-band (FR3) at 15 GHz
since: 1.0.0rc2
purpose: >
  The `urban-grid-10ghz` world moved to 15 GHz, the middle of the upper mid-band (7 to 24 GHz,
  often called FR3) that 3GPP studies for 5G-Advanced and beyond: the same 3 x 3-block grid with small
  cells every 100 m, the TR 38.901 UMi street-canyon model with building LOS and place-tied
  shadowing, a 400 MHz carrier and an array of the same physical size as at 10 GHz, so that its
  beam gain is 20 log10(15/10) = 3.5 dB higher.  Path loss grows by about as much, the noise by
  3 dB (twice the bandwidth), so the signal-to-noise ratio is about 3 dB lower.  Use it next to
  `urban-grid-10ghz` to see how a rule's trade-off between failures and unnecessary handovers moves
  with the carrier; everything else stays the same.
layout_note: >
  Three by three blocks (433 m x 250 m between street centre lines, 20 m streets), 76 sites, as in
  `urban-grid-10ghz`.
scenario:
  name: fr3-urban-15ghz
  layout: {kind: street_grid, blocks: [3, 3], site_spacing_m: 100.0}
  radio: {carrier_ghz: 15.0, bandwidth_mhz: 400.0, bs_gain_db: 23.5, pathloss: umi_street_canyon, ue_height_m: 1.6}
  mobility: {users: 40, profile: v60}
  run: {duration_s: 120.0, warmup_s: 20.0}
sources:
  radio.carrier_ghz: "the 7-24 GHz range of the Rel-19 study on channel modelling enhancements, now in TR 38.901 V19.5.0 (Tables 7.4.1-1 and 7.4.2-1 unchanged for UMi); 15 GHz is an assumption"
  radio.bandwidth_mhz: "assumption (400 MHz channel in the upper mid-band)"
  radio.bs_gain_db: "assumption (array of the same aperture as at 10 GHz: +20 log10(15/10) dB)"
  radio.ue_height_m: "TR 37.885 clause 6.1.2 (urban option A: 100 % vehicle type 2, antenna height 1.6 m; since 2.1.0, until 2.0.0 1.5 m)"
limitations:
  - "Small cells on UMi along the streets: TR 37.885 itself has 500 m macro sites with UMa in the urban grid (Tables 6.1.3-2 and 6.2.1-2); only the road geometry and the turning probabilities are TR 37.885's."
  - "Sites stand 9 m from the street centre line, so users pass closer than 10 m to a site; the path loss is evaluated at 10 m there (radio.pl_min_distance_m, the lower end of the UMi range 10 m <= d2D of TR 38.901 Table 7.4.1-1; since 2.0.0)."
  - "Received-power level only: no fast fading, no link-level physical layer, one beam gain and one isolation factor."
  - "TR 38.901 UMi parameters are used at 15 GHz; the model's validity in the 7-24 GHz range was re-examined in Rel-19, and frequency-dependent material penetration or foliage loss is not modelled."
  - "The absolute failure level is not calibrated. It was checked against ns-3 only on `ns3-urban-3.5ghz`: with equal run lengths the ns-3 comparison setting gives 0.5-1.3 times ns-3's failure level, depending on the set, and passes the pre-registered checks on 1 of 4 fresh sets (V4; corrected in 2.6.0, docs/calibration.md); read failure rates relative to each other and to `urban-grid-10ghz`."
  - "The LOS state of a link is LOS only if the buildings leave it clear and the spatially consistent LOS variable of TR 38.901 clause 7.6.3.3 is below the LOS probability of Table 7.4.2-1; the share of LOS links is therefore lower than Table 7.4.2-1 gives (which `handoverlab verify` compares only for the links clear of buildings)."
  - "One shadowing decorrelation distance, the UMi LOS value of 10 m, also for the NLOS links (TR 38.901 Table 7.5-6 Part-1: UMi LOS 10 m, NLOS 13 m); LOS and NLOS links share one unit shadowing realisation scaled by the LOS or NLOS standard deviation, so the shadowing keeps its sign when a link changes state (TR 38.901 gives separate LOS and NLOS parameters, Table 7.5-6)."
  - "A vehicle keeps a lane offset drawn at the start, on either side of the street centre line, through turns: it may drive in a lane of the opposite direction (TR 37.885 Table A-1 has 2 lanes in each direction)."
  - "The number of vehicles is set for run time: TR 37.885 clause 6.1.2 places vehicles with a gap of max(2 m, exponential with mean speed x 2 s), which gives hundreds of vehicles in the grid; the interference load of HandoverLab does not depend on the number of users."
  - "The radio map takes as long to build as for `urban-grid-10ghz` (once per seed)."
references:
  - "Same layout, mobility and seeds as `urban-grid-10ghz`; the path-loss formula is checked against hand values in the unit tests at all carriers."
