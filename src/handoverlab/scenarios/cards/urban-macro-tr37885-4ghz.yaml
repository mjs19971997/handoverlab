# Scenario card (machine-readable).  docs/scenarios/urban-macro-tr37885-4ghz.md is generated from this file.
name: urban-macro-tr37885-4ghz
title: The TR 37.885 urban grid with macro sites (500 m hexagonal layout, 4 GHz)
since: 2.3.0
purpose: >
  The urban case of the 3GPP NR V2X evaluation (TR 37.885) as specified below 6 GHz, for the
  base-station-to-vehicle link: the urban grid of 433 m x 250 m blocks with 2 + 2 lanes of 3.5 m,
  macro sites 25 m high on a hexagonal layout with an inter-site distance of 500 m (TR 36.885
  Figure A.1.3-1, which TR 37.885 uses), the UMa path loss at 4 GHz with the LOS state drawn from the
  LOS probability (the sites stand above the rooftops, so the buildings of the grid do not decide it)
  and the effective environment height of 0.25 m, and every vehicle at 60 km/h.  Use it next to the
  small-cell grid cards when results should follow the 3GPP urban V2X assumptions.
layout_note: >
  The minimum area of TR 37.885 Table A-1, 3 x 3 blocks (1319 m x 770 m with the streets), and the 35
  sites of the 500 m hexagonal lattice that lie within 1000 m of it.  The lattice is placed relative
  to the blocks as drawn in TR 36.885 Figure A.1.3-1 (columns 433 m apart along the 433 m side of the
  blocks, sites 500 m apart along the 250 m side, alternate columns shifted by 250 m; a site about
  282 m and 160 m from the corner of its block).  The figure has no numbers: the position of the
  lattice is read from the drawing and is approximate.
