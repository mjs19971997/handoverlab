  radio.ue_gain_db: "assumption, as on highway-tr37885-4ghz: vehicle type 2, option 1, rooftop baseline (1, 2, 2, 1, 1) of TR 37.885 Table 6.1.4-9 with 3 dBi elements (Table 6.1.4-8): 3 + 10 log10(2) dB"
  radio.noise_figure_db: "TR 37.885 Table 6.1.1-1 (UE receiver noise figure 9 dB)"
  radio.bs_height_m: "TR 37.885 Table 6.1.4-1 (urban grid, macro BS: 25 m)"
  radio.ue_height_m: "TR 37.885 clause 6.1.2 (vehicle type 2: antenna height 1.6 m)"
  radio.pathloss: "TR 37.885 Table 6.2.1-2 (urban, below 6 GHz, V2B/B2V: TR 38.901 UMa LOS and NLOS)"
  radio.building_los: "TR 37.885 clause 6.2.1 (urban V2B links: LOS/NLOS propagation type derived from the probability formula, spatially consistent per TR 38.901 clause 7.6.3.3); the macro sites stand above the rooftops (TR 38.901 clause 6.2, item (2): UMa BSs mounted above the rooftop levels of the surrounding buildings)"
  radio.env_height_m: "TR 37.885 clause 6.2.1 (the effective environment height hE to 0.25 m)"
  radio.shadow_los_db: "TR 37.885 clause 6.2.2 (shadowing of the TR 38.901 model) and TR 38.901 Table 7.4.1-1 (UMa LOS: 4 dB)"
