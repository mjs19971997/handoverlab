# Scenario card (machine-readable).  docs/scenarios/rural-700mhz.md is generated from this file.
name: rural-700mhz
title: Rural macro cells at 700 MHz
since: 1.7.0
purpose: >
  A rural counterpart of the urban scenarios: 11 macro sites 35 m high on a hexagonal grid with an
  inter-site distance of 1732 m (the RMa case of TR 38.901), the RMa path loss at 700 MHz, the
  link budget of the IMT-2020 Rural-eMBB evaluation, and users in cars at 120 km/h with the
  TR 38.901 car penetration loss.  Cells are large, so a user sees few handovers, each at high
  speed and at the edge of wide, partly noise-limited coverage.  Use it to see how a rule copes
  with coverage-limited cell edges rather than with interference from close neighbours.
layout_note: >
  A 6000 m x 3500 m area, 11 sites on a hexagonal grid of 1732 m (rows of 4, 3 and 4 sites).  No
  roads or buildings: the RMa LOS probability stands for terrain and vegetation.
scenario:
  name: rural-700mhz
  layout: {kind: open_area, area_m: [6000.0, 3500.0], site_spacing_m: 1732.0, min_site_distance_m: 35.0}
  radio: {carrier_ghz: 0.7, bandwidth_mhz: 20.0, tx_power_dbm: 49.0, bs_gain_db: 17.0,
          bs_height_m: 35.0, ue_height_m: 1.5, pathloss: rma, shadow_los_db: 4.0, shadow_los_far_db: 6.0,
          shadow_nlos_db: 8.0, shadow_decorr_m: 120.0, los_corr_m: 60.0, penetration_db: 9.0,
          penetration_sd_db: 5.0, soft_los: true, map_res_m: 10.0}
  mobility: {users: 30, profile: v120}
  run: {duration_s: 300.0, warmup_s: 30.0}
sources:
  layout.kind: "TR 38.901 Table 7.2-3 (RMa: hexagonal grid)"
  layout.area_m: "assumption (room for 11 sites)"
  layout.site_spacing_m: "TR 38.901 Table 7.2-3 and ITU-R M.2412-0 Table 5c (ISD 1732 m)"
  layout.min_site_distance_m: "TR 38.901 Table 7.2-3 (minimum BS-UT 2D distance 35 m; applied to the start and waypoints)"
  radio.carrier_ghz: "ITU-R M.2412-0 Table 5c (Rural-eMBB, configuration A: 700 MHz)"
  radio.bandwidth_mhz: "ITU-R M.2412-0 Table 5c (20 MHz for TDD)"
  radio.tx_power_dbm: "ITU-R M.2412-0 Table 5c (49 dBm for 20 MHz)"
  radio.bs_gain_db: "assumption: 8 dBi element (ITU-R M.2412-0 Table 5c) plus an 8-element beam (9 dB)"
  radio.noise_figure_db: "ITU-R M.2412-0 Table 5c (UE noise figure: 7 dB, the default)"
  radio.bs_height_m: "TR 38.901 Tables 7.2-3 and 7.4.1-1 (RMa: 35 m)"
  radio.pathloss: "TR 38.901 Table 7.4.1-1 (RMa, W = 20 m, h = 5 m); LOS probability, Table 7.4.2-1"
  radio.shadow_los_db: "TR 38.901 Table 7.4.1-1 (RMa LOS below the breakpoint: 4 dB)"
  radio.shadow_los_far_db: "TR 38.901 Table 7.4.1-1 (RMa LOS beyond the breakpoint: 6 dB)"
  radio.shadow_nlos_db: "TR 38.901 Table 7.4.1-1 (RMa NLOS: 8 dB)"
  radio.shadow_decorr_m: "TR 38.901 Table 7.5-6 Part-2 (RMa NLOS: 120 m)"
  radio.los_corr_m: "TR 38.901 Table 7.6.3.1-2 (RMa LOS/NLOS state: 60 m)"
  radio.soft_los: "TR 38.901 clause 7.6.3.3 (optional soft LOS state, meant to avoid hard LOS/NLOS transitions in mobility simulations)"
  radio.penetration_db: "TR 38.901 clause 7.4.3.2 (O2I car penetration loss: 9 dB)"
  radio.penetration_sd_db: "TR 38.901 clause 7.4.3.2 (5 dB, per user)"
  radio.map_res_m: "numerical setting (coarser map for the large area)"
  mobility.profile: "ITU-R M.2412-0 Table 5c (fixed and identical speed of all UEs; outdoor users in car: 120 km/h; since 2.1.0, until 2.0.0 108-132 km/h)"
  mobility.users: "assumption (30 users for run time; ITU-R M.2412-0 Table 5c: 10 UEs per TRxP)"
limitations:
  - "Only the users in cars: TR 38.901 Table 7.2-3 and ITU-R M.2412-0 have 50 % indoor users at 3 km/h, which hardly hand over and are left out."
  - "11 omnidirectional sites instead of 19 sites with 3 sectors, no wrap-around (users near the edge see fewer neighbours), about 3 users per site instead of 10 per TRxP; the minimum distance of 35 m to a site holds for the start and waypoints of a user, the straight legs between them may pass closer."
  - "One shadowing decorrelation distance: TR 38.901 gives 37 m for LOS and 120 m for NLOS links; here 120 m."
  - "Far more handovers than the cell size alone would give (A3 with 3 dB and 160 ms: about 12 per user-minute in a check run of 3 seeds with the model of 2.0.0), mostly unnecessary ones: the 8 dB shadowing with 120 m decorrelation, uncorrelated between sites (TR 38.901 clause 7.5 step 4; half correlated until 2.0.0), moves the best cell often at 120 km/h. Compare rules with each other here; do not read the absolute handover rate as that of a real rural network."
  - "The soft LOS state is on: at 1-2 km the RMa NLOS loss is about 20 dB above the LOS loss, and the hard switch of the LOS state (radio.soft_los: false) raises the A3 failures (3 dB, 160 ms) from 0.07 to 0.18 per user-minute and the handovers from 13.07 to 15.62 (means over 3 seeds, docs/guides/indoor-rural.md)."
  - "Vehicles move on straight legs between random waypoints, not on roads; random waypoints are denser in the middle of the area, while ITU-R M.2412-0 Table 5c drops the users uniformly."
  - "Links reach about 6.4 km (from a corner site to the opposite corner), beyond the 5 km up to which TR 38.901 Table 7.4.1-1 gives the RMa NLOS formula; those far interferers use it outside its range (handoverlab warns about this)."
  - "LOS and NLOS links share one unit shadowing realisation scaled by the LOS or NLOS standard deviation (TR 38.901 gives separate LOS and NLOS parameters, Table 7.5-6)."
  - "The absolute failure level is not calibrated. It was checked against ns-3 only on `ns3-urban-3.5ghz`: with equal run lengths the ns-3 comparison setting gives 0.5-1.3 times ns-3's failure level, depending on the set, and passes the pre-registered checks on 1 of 4 fresh sets (V4; corrected in 2.6.0, docs/calibration.md); read failure rates relative to each other."
references:
  - "Layout, heights, path loss, LOS probability, shadowing and correlation distances checked against TR 38.901 V19.5.0 (unchanged from V17.0.0), the link budget and speeds against ITU-R M.2412-0; path loss and LOS probability against values computed by hand (handoverlab verify, group pathloss); determinism and invariant checks as for every scenario."
