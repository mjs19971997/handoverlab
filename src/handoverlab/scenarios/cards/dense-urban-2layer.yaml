# Scenario card (machine-readable).  docs/scenarios/dense-urban-2layer.md is generated from this file.
name: dense-urban-2layer
title: Two-layer dense urban deployment of ITU-R M.2412 (4 GHz macro + 30 GHz micro, SSB beams)
since: 1.10.0
purpose: >
  The Dense Urban-eMBB test environment of ITU-R M.2412-0 in its two-layer form (Configuration C):
  a macro layer at 4 GHz on a hexagonal grid with 200 m between sites and three TRxPs (sectors)
  per site, and a micro layer at 30 GHz with three micro sites per macro TRxP, each with three
  TRxPs.  Every TRxP sends 8 SSB beams from a 4 x 8 panel with the element of TR 38.901 Table 7.3-1.
  Users are the outdoor in-car users of M.2412 (30 km/h).  Measurements follow the periods of
  TS 38.133 (inter-frequency measurements in gaps), and the rule `a3a5` hands over with Event A3
  within a layer and Event A5 between layers.  Use it to study multi-layer mobility, beam failures
  and inter-frequency handovers.
layout_note: >
  Open area of 800 m x 700 m (no wrap-around), 23 macro sites (ISD 200 m) and 207 micro sites
  (drawn once: 3 per macro TRxP, uniform by area in the TRxP's 120-degree wedge between 25 m and
  115.5 m from the macro site, at least 20 m apart; numpy default_rng(2412)).
