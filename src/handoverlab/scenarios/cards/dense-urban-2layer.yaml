sources:
  layout.kind: "ITU-R M.2412-0 clause 8.3 (no topographical details; regular hexagonal macro grid)"
  layout.site_spacing_m: "ITU-R M.2412-0 Table 5b (macro layer ISD 200 m)"
  layout.sites: "hexagonal macro grid with ISD 200 m in the area (ITU-R M.2412-0 clause 8.3)"
  layout.area_m: "assumption (800 m x 700 m, about 23 macro sites)"
  radio.scs_khz: "assumption (30 kHz at 4 GHz)"
  radio.carrier_ghz: "ITU-R M.2412-0 Table 5b, Configuration C (macro layer 4 GHz)"
  radio.bandwidth_mhz: "ITU-R M.2412-0 Table 5b (20 MHz TDD at 4 GHz)"
  radio.tx_power_dbm: "ITU-R M.2412-0 Table 5b (macro 4 GHz: 44 dBm for 20 MHz)"
  radio.bs_height_m: "ITU-R M.2412-0 Table 5b (25 m for macro sites)"
  radio.noise_figure_db: "ITU-R M.2412-0 Table 5b (UE noise figure 7 dB at 4 GHz)"
  radio.ue_gain_db: "ITU-R M.2412-0 Table 5b (UE antenna element gain 0 dBi at 4 GHz)"
  radio.beams: "M.2412 clause 8.3.2 (three TRxPs per macro site); element of TR 38.901 Table 7.3-1 (8 dBi, M.2412 BS element gain 8 dBi); panel size, 8 SSB beams (L_max at 4 GHz) and tilt are assumptions"
  radio.layers: "M.2412 clause 8.3.2 and Table 5b: micro layer at 30 GHz, 80 MHz, 33 dBm, 10 m, UE noise figure 10 dB, UE element gain 5 dBi; 3 micro sites per macro TRxP (placement method and three TRxPs per micro site: assumptions, as M.2412 leaves them to the proponent)"
  radio.pathloss: "TR 38.901 UMa (macro) and UMi street canyon (micro), as ITU-R M.2412-0 Annex 1 Table A1-1 uses for Dense Urban"
  layout.min_site_distance_m: "TR 38.901 Table 7.2-1 (UMa: minimum BS-UT distance 35 m; applied to the start and waypoints, macro sites only)"
  radio.shadow_los_db: "TR 38.901 Table 7.4.1-1 (UMa LOS: 4 dB); micro layer UMi LOS: 4 dB"
  radio.shadow_nlos_db: "TR 38.901 Table 7.4.1-1 (UMa NLOS: 6 dB); micro layer UMi NLOS: 7.82 dB"
  radio.shadow_decorr_m: "TR 38.901 Table 7.5-6 Part-1 (UMa NLOS: 50 m; micro layer UMi NLOS: 13 m)"
  radio.los_corr_m: "TR 38.901 Table 7.6.3.1-2 (LOS/NLOS state: UMa and UMi 50 m)"
  radio.penetration_db: "ITU-R M.2412-0 Annex 1 clause 3.3 and TR 38.901 clause 7.4.3.2 (in-car users: 9 dB)"
  radio.penetration_sd_db: "ITU-R M.2412-0 Annex 1 clause 3.3 and TR 38.901 clause 7.4.3.2 (5 dB, per user)"
  protocol.meas_periods: "TS 38.133 Tables 9.2.5.2-1/-2 and 9.3.5-1/-2 (gap pattern 0 of Table 9.1.2-1)"
  protocol.rlm_eval: "TS 38.133 Tables 8.1.2.2-1/-2"
  mobility.profile: "ITU-R M.2412-0 Table 5b: fixed and identical speed of the outdoor (in-car) users, 30 km/h = 8.333 m/s (since 2.1.0; until 2.0.0 8.33 m/s); the 80 % indoor users are not simulated"
  mobility.users: "assumption (20 users for run time; ITU-R M.2412-0 Table 5b: 10 UEs per TRxP)"
limitations:
  - "No wrap-around: users near the edge of the area see fewer interferers than in M.2412."
  - "No fast fading and no UE beamforming; one hypothetical beam per SSB with fixed DFT weights."
  - "Only the outdoor in-car users of M.2412 are simulated (the 80 % indoor users and building penetration are not)."
  - "The micro-site positions are one draw; other draws give other statistics."
  - "One shadowing decorrelation distance per layer, that of the NLOS links (TR 38.901 Table 7.5-6 Part-1: UMa LOS 37 m, UMi LOS 10 m)."
  - "The minimum distance of 35 m holds for the macro sites; the 10 m of UMi (TR 38.901 Table 7.2-1) to the micro sites is not enforced."
  - "20 users for 69 macro TRxPs instead of the 10 UEs per TRxP of ITU-R M.2412-0 Table 5b; the number is set for run time (the interference load of HandoverLab does not depend on it). Users move between random waypoints, which are denser in the middle of the area, while M.2412-0 drops them uniformly with a uniformly distributed direction."
  - "LOS and NLOS links share one unit shadowing realisation per layer, scaled by the LOS or NLOS standard deviation (TR 38.901 gives separate LOS and NLOS parameters, Table 7.5-6)."
  - "Changed in 1.11.0: until 1.10.0 the macro layer had the UMi shadowing (7.82 dB NLOS, 10 m) and the in-car users no car penetration loss."
references:
  - "ITU-R M.2412-0 (2017) clause 8.3.2 and Table 5b (local copy std3gpp/pdf/R-REP-M.2412-2017-PDF-E.pdf)."
