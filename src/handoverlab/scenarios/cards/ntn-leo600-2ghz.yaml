# Scenario card (machine-readable).  docs/scenarios/ntn-leo600-2ghz.md is generated from this file.
name: ntn-leo600-2ghz
title: A LEO satellite at 600 km with 19 earth-moving beams in the S band (NTN)
since: 2.0.0
purpose: >
  The LEO scenario of the 3GPP NTN study (TR 38.821) that RAN2 prioritised for mobility: one satellite at
  600 km altitude, transparent payload, 19 beams fixed in the satellite frame (they sweep over the ground with
  the satellite at 7.56 km/s), Set-1 satellite parameters in the S band (2 GHz, 30 MHz), frequency reuse 1,
  handheld users at 3 km/h in a rural area, and the large-scale channel of TR 38.811.  The handovers come from
  the satellite's motion, not the users': every user crosses a beam within seconds.  Use it for NTN
  mobility, e.g. conditional handover with the location condition D2 of Release 18 (rule `cho_d2`).
layout_note: >
  The users' area of 60 km x 60 km around the point at which the central beam points with 30 degrees
  elevation at the middle of the run, and the beam centres on the ground at that time (the drawing leaves out
  the three below 10 degrees elevation, far to the east).  The satellite passes west of the area, moving north.
