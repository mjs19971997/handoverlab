  name: ntn-leo600-2ghz
  layout: {kind: ntn, area_m: [60000.0, 60000.0]}
  radio: {carrier_ghz: 2.0, bandwidth_mhz: 30.0, noise_figure_db: 7.0, ue_gain_db: 0.0, isolation: 1.0,
          time_var_db: 0.0}
  ntn: {altitude_km: 600.0, aperture_m: 2.0, eirp_dbw_per_mhz: 34.0, n_beams: 19, centre_elevation_deg: 30.0,
        environment: rural, atm_zenith_db: 0.045, scintillation_db: 2.2, sf_corr_m: 37.0, los_corr_m: 60.0}
