# Scenario card (machine-readable).  docs/scenarios/highway-tr37885-4ghz.md is generated from this file.
name: highway-tr37885-4ghz
title: The TR 37.885 highway below 6 GHz (baseline layout, 4 GHz)
since: 1.11.0
purpose: >
  The highway case of the 3GPP NR V2X evaluation (TR 37.885) as specified below 6 GHz, for the
  base-station-to-vehicle link: a road of 3 + 3 lanes of 4 m, macro sites along the road 35 m away
  with an inter-site distance of 1732 m (the baseline of TR 36.885 clause A.1.3, which TR 37.885
  uses), wrap-around, the RMa LOS path loss at 4 GHz, and every vehicle at 140 km/h.  Cells are
  long and the link is always LOS, so handovers are rare, regular and happen at high speed.  Use it
  for results that should follow the 3GPP highway assumptions as closely as this simulator can.
layout_note: >
  A road of 3464 m along the x axis (24 m wide), two sites 1732 m apart, both 35 m beyond the
  northern road edge; the road wraps around after two sites (TR 36.885 Figure A.1.3-2).
