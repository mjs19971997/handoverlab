# Scenario card (machine-readable).  docs/scenarios/highway-10ghz.md is generated from this file.
name: highway-10ghz
title: The TR 37.885 highway with roadside sites at 10 GHz
since: 1.0.0rc3
purpose: >
  A vehicular counterpart of the urban grid: a straight road of 2000 m with three lanes of 4 m per
  direction (the highway case of TR 37.885), roadside sites every 500 m (the inter-site distance
  of the TR 37.885 highway set-up above 6 GHz), 35 m beyond the road edge and
  alternately on the two sides, and lane-keeping vehicles at 70 to 140 km/h.  The sites follow a
  line, so every handover is between two neighbours along the road and happens at high speed:
  short times of stay, few candidate cells and a large share of late handovers.  Use it to see how
  a rule copes with speed rather than with dense, irregular coverage.
layout_note: >
  A 2000 m road along the x axis (24 m wide: 3 + 3 lanes of 4 m), four sites at 500 m spacing,
  35 m from the road edge and alternately on the two sides.  The drawing is to scale, so the road
  is a thin band.
scenario:
  name: highway-10ghz
  layout: {kind: highway, lanes: 3, lane_width_m: 4.0, road_length_m: 2000.0, site_spacing_m: 500.0,
           site_offset_m: 35.0}
  radio: {pathloss: uma, bs_height_m: 25.0, shadow_nlos_db: 6.0, shadow_decorr_m: 37.0}
  mobility: {users: 40, profile: hwy}
  run: {duration_s: 120.0, warmup_s: 20.0}
sources:
  layout.kind: "TR 37.885 Annex A, Table A-1 (highway)"
  layout.site_spacing_m: "TR 37.885 clause 6.1.3 (highway above 6 GHz: inter-site distance 500 m)"
  layout.site_offset_m: "assumption (35 m from the road edge, after the 35 m freeway offset of TR 36.885 clause A.1.3)"
  radio.pathloss: "TR 38.901 Table 7.4.1-1 (UMa)"
  radio.bs_height_m: "TR 38.901 Table 7.4.1-1 (UMa: 25 m)"
  radio.shadow_nlos_db: "TR 38.901 Table 7.4.1-1 (UMa NLOS: 6 dB)"
  radio.shadow_decorr_m: "TR 38.901 Table 7.5-6 (UMa LOS: 37 m)"
  mobility.profile: "TR 37.885 clause 6.1.2 (highway: 140 km/h, optionally 70 km/h); uniform between them is an assumption"
limitations:
  - "The road has no wrap-around: at its end a vehicle turns into the same lane of the other direction, so the ends of the road are crossed twice as often as the middle is passed, and the outermost sites see turning vehicles."
  - "The LOS state follows the TR 38.901 UMa LOS probability as a process along each vehicle's path; on an open road it stands for blocking by other vehicles and roadside obstacles and is more pessimistic than a free highway."
  - "No Doppler, no fast fading and no vehicle-to-vehicle links; received-power level only, as in the other scenarios."
  - "The failure model is not calibrated in absolute terms; read failure rates relative to each other."
references:
  - "Layout geometry, lane keeping, speeds and the turn at the road end are checked in the unit tests; determinism and invariant checks as for every scenario."
