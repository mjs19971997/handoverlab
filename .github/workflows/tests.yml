name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    name: lint (ruff) and release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff==0.17.1"
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Release metadata agree
        run: python tools/release_check.py

  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,report]"
      - name: Install pyarrow and the dashboard extra (Linux and Windows, Python 3.12, for the Parquet and dashboard tests)
        if: matrix.python-version == '3.12' && (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest')
        run: python -m pip install pyarrow -e ".[gui]"
      - name: Test
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') }}
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q
      - name: Test with coverage (minimum in pyproject.toml, [tool.coverage.report] fail_under)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          MPLBACKEND: Agg
        run: |
          python -m pip install "pytest-cov>=4"
          python -m pytest -q --cov=handoverlab --cov-report=term --cov-report=xml
      - name: Upload the coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
      - name: Verify
        env:
          MPLBACKEND: Agg
        run: handoverlab verify --only pathloss fingerprints --json verify-report.json
      - name: Example study (plan only)
        run: handoverlab study examples/study_smoke.yaml --dry-run
      - name: Dashboard starts (headless)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          handoverlab gui --headless --port 8599 --address 127.0.0.1 > gui.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8599/_stcore/health; then ok=1; break; fi
            sleep 2
          done
          cat gui.log
          kill $pid || true
          if [ "$ok" != 1 ]; then echo "::error title=dashboard did not start::$(tail -c 2500 gui.log | tr '\n' ' ')"; exit 1; fi
