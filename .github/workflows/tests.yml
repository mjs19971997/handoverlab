name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,report]"
      - name: Install pyarrow and the dashboard extra (one job, for the Parquet and dashboard tests)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pip install pyarrow -e ".[gui]"
      - name: Test
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q
      - name: Verify
        env:
          MPLBACKEND: Agg
        run: handoverlab verify --only pathloss fingerprints --json verify-report.json
      - name: Example study (plan only)
        run: handoverlab study examples/study_smoke.yaml --dry-run
      - name: Dashboard starts (headless)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          handoverlab gui --headless --port 8599 --address 127.0.0.1 > gui.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8599/_stcore/health; then ok=1; break; fi
            sleep 2
          done
          cat gui.log
          kill $pid || true
          if [ "$ok" != 1 ]; then echo "::error title=dashboard did not start::$(tail -c 2500 gui.log | tr '\n' ' ')"; exit 1; fi
