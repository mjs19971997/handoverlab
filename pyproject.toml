[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handoverlab"
version = "2.2.0"
description = "System-level handover simulator for 5G-Advanced and beyond-5G research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mostafa Jalili Sanjarani" },
    { name = "Yasser Elmi Sola" },
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pyyaml>=5.4",
    "tomli>=1.1; python_version < '3.11'",
]
keywords = ["handover", "conditional handover", "mobility", "system-level simulation", "5G", "3GPP"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=7"]
cov = ["pytest>=7", "pytest-cov>=4"]
lint = ["ruff>=0.6"]
parquet = ["pyarrow>=8"]
report = ["matplotlib>=3.3"]
gui = ["streamlit>=1.37", "matplotlib>=3.3"]
docs = ["mkdocs>=1.6", "mkdocstrings[python]>=0.26"]
torch = ["torch>=2.1"]
fast = ["numba>=0.58"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "pyarrow>=8", "matplotlib>=3.3", "streamlit>=1.37"]

[project.scripts]
handoverlab = "handoverlab.cli:main"

[project.urls]
Homepage = "https://github.com/mjs19971997/handoverlab"
Issues = "https://github.com/mjs19971997/handoverlab/issues"
Documentation = "https://mjs19971997.github.io/handoverlab/"
Changelog = "https://github.com/mjs19971997/handoverlab/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
handoverlab = ["py.typed", "scenarios/cards/*.yaml", "verify/data/*.json", "verify/data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["docs/fa"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# the step loops keep paired updates of the same state on one line
"src/handoverlab/engine/*.py" = ["E702"]
"src/handoverlab/mobility.py" = ["E702"]

[tool.coverage.run]
source = ["handoverlab"]
branch = false

[tool.coverage.report]
# minimum total coverage checked in CI (the Linux / Python 3.12 test job); 91.6 % at 1.1.1
fail_under = 90
show_missing = false
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]
