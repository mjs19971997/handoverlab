# Documentation site: python -m pip install -e ".[docs]" && mkdocs serve   (or: mkdocs build)
site_name: HandoverLab
site_description: System-level handover simulator for 5G-Advanced and beyond-5G research
site_url: https://mjs19971997.github.io/handoverlab/
repo_url: https://github.com/mjs19971997/handoverlab
edit_uri: blob/main/docs/
copyright: MIT licence
docs_dir: docs
hooks:
  - tools/mkdocs_hooks.py
exclude_docs: |
  fa/

theme:
  name: readthedocs
  navigation_depth: 3

nav:
  - Home: index.md
  - Tutorials:
      - 1. Your first run: tutorials/first-run.md
      - 2. Writing your own rule: tutorials/own-rule.md
      - 3. A fair tuning study: tutorials/tuning-study.md
      - 4. Reading the report: tutorials/reading-the-report.md
  - Guides:
      - User guide: user_guide.md
      - Dashboard: guides/dashboard.md
      - Add a scenario: guides/add-scenario.md
      - Run on many cores: guides/many-cores.md
      - Export event logs: guides/export-event-logs.md
      - Reproduce and check results: guides/reproduce.md
      - DAPS handover and LTM: guides/daps-ltm.md
      - A learning-based rule: guides/learning-rule.md
      - The upper mid-band: guides/upper-mid-band.md
      - A highway: guides/highway.md
      - Indoor and rural scenarios: guides/indoor-rural.md
      - Mobility robustness optimisation: guides/mro.md
      - Beams and several carriers: guides/beams-layers.md
      - Your own radio map: guides/radio-maps.md
      - A LEO satellite (NTN): guides/ntn.md
      - Moving from 1.x to 2.0: migration-2.0.md
      - The 10 ms step: time-step.md
      - Reference study: reference-study.md
      - Scenario cards:
          - smoke: scenarios/smoke.md
          - urban-grid-10ghz: scenarios/urban-grid-10ghz.md
          - open-area-10ghz: scenarios/open-area-10ghz.md
          - ns3-urban-3.5ghz: scenarios/ns3-urban-3.5ghz.md
          - fr3-urban-15ghz: scenarios/fr3-urban-15ghz.md
          - highway-tr37885-4ghz: scenarios/highway-tr37885-4ghz.md
          - highway-tr37885-30ghz: scenarios/highway-tr37885-30ghz.md
          - ntn-leo600-2ghz: scenarios/ntn-leo600-2ghz.md
          - indoor-office-4ghz: scenarios/indoor-office-4ghz.md
          - rural-700mhz: scenarios/rural-700mhz.md
          - urban-grid-28ghz-beams: scenarios/urban-grid-28ghz-beams.md
          - dense-urban-2layer: scenarios/dense-urban-2layer.md
  - Reference:
      - Command line: reference/cli.md
      - Metric names: reference/metrics.md
      - API:
          - Top-level package: reference/api/index.md
          - Configuration: reference/api/config.md
          - Running rules: reference/api/simulate.md
          - Rule interface: reference/api/rules.md
          - Rule contract kit: reference/api/testing.md
          - Event logs: reference/api/eventlog.md
          - Radio-map files: reference/api/mapfile.md
          - NTN: reference/api/ntn.md
          - Engine and metrics: reference/api/engine.md
          - Built-in scenarios: reference/api/scenarios.md
          - Studies: reference/api/studies.md
          - Paired statistics: reference/api/stats.md
          - Verification: reference/api/verify.md
          - Dashboard logic: reference/api/gui.md
          - Stability helpers: reference/api/stability.md
  - Explanation:
      - Verification: verification.md
      - Standard compliance: standard-compliance.md
      - Radio calibration against 3GPP: calibration-3gpp.md
      - Failure-model calibration: calibration.md
      - Performance: performance.md
  - Project:
      - Stability policy: stability.md
      - Releasing: RELEASING.md

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_signature_annotations: true
            separate_signature: false
            filters: ["!^_"]
            heading_level: 2
